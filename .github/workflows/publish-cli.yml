name: Publish CLI to npm

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (optional, for manual run)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: mybacklink-cli
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build CLI
        working-directory: mybacklink-cli
        run: pnpm build

      - name: Validate package name
        working-directory: mybacklink-cli
        run: |
          test "$(node -p "require('./package.json').name")" = "@mybacklinks/cli"

      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: mybacklink-cli
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF#refs/tags/}"
          EXPECTED_TAG="cli-v${VERSION}"
          if [ "${TAG}" != "${EXPECTED_TAG}" ]; then
            echo "Tag ${TAG} does not match package version ${VERSION} (expected ${EXPECTED_TAG})"
            exit 1
          fi

      - name: Publish to npm
        working-directory: mybacklink-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
